services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/root/.cache
      - ./models.ini:/models.ini
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      # To only use models defined in models.ini
      - LLAMA_CACHE=/tmp/empty
      - HIP_VISIBLE_DEVICES=0,1
    command:
      - "--models-max"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-preset"
      - "/models.ini"
      - "-ngl"
      - "999"
      - "--sleep-idle-seconds"
      - "30"
      - "--jinja"
    restart: unless-stopped
